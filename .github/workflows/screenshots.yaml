# Copies the screenshots of an existing build run into docs/screenshots, so the
# README can show them without building everything again.
name: Publish screenshots

on:
  workflow_dispatch:
    inputs:
      run_id:
        description: ID of a successful "Build MyOS ISO" run
        required: true
  push:
    branches: [plasma-distro]
    paths: [".github/workflows/screenshots.yaml"]

permissions:
  contents: write
  actions: read

jobs:
  screenshots:
    name: Commit screenshots
    runs-on: ubuntu-24.04
    env:
      # Used when started by a push: the run that tested commit 2134616.
      RUN_ID: ${{ inputs.run_id || '45904927211' }}
    steps:
      - uses: actions/checkout@v7
      - uses: actions/download-artifact@v8
        with:
          pattern: boot-*-uefi
          path: shots
          run-id: ${{ env.RUN_ID }}
          github-token: ${{ github.token }}
      - uses: actions/download-artifact@v8
        with:
          pattern: install-*-plain
          path: shots
          run-id: ${{ env.RUN_ID }}
          github-token: ${{ github.token }}
      - name: Collect and commit
        run: |
          scripts/collect-screenshots.sh shots docs/screenshots
          git config user.name spaceayyat
          git config user.email azsr2710@gmail.com
          git add docs/screenshots
          if git diff --cached --quiet; then exit 0; fi
          git commit -m "Add screenshots from test run ${RUN_ID}"
          git pull --rebase origin "${GITHUB_REF_NAME}"
          git push origin "HEAD:${GITHUB_REF_NAME}"
