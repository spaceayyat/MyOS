# Checks the installer theme against the real web installer in Fedora 44.
name: Installer theme

on:
  workflow_dispatch:
  push:
    branches: [vylo]
    paths:
      - ".github/workflows/installer-theme.yaml"
      - "image/config/rootfs-vylo/usr/share/vylo/installer/**"
      - "image/config/rootfs-vylo/usr/libexec/vylo/installer-theme"

permissions:
  contents: read

jobs:
  probe:
    name: Apply the VYLO theme
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7
      - name: Apply the theme to the real installer in Fedora 44
        run: |
          docker run --rm -v "$PWD:/work:ro" -w /work registry.fedoraproject.org/fedora:44 bash -c '
            set -e
            dnf install -y anaconda-webui >/dev/null
            python3 image/config/rootfs-vylo/usr/libexec/vylo/installer-theme \
              --source image/config/rootfs-vylo/usr/share/vylo/installer \
              --background image/config/rootfs/usr/share/wallpapers/vylo/cosmos-indigo.jpg \
              --out /tmp/branding
            ls -l /tmp/branding'
