# Checks the installer theme against the real web installer in Fedora 44.
name: Installer theme

on:
  workflow_dispatch:
  push:
    branches: [vylo]
    paths:
      - ".github/workflows/installer-theme.yaml"

permissions:
  contents: read

jobs:
  probe:
    name: Read the installer's styles
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - name: Print the web installer's files
        run: |
          docker run --rm registry.fedoraproject.org/fedora:44 bash -c '
            set -e
            dnf install -y anaconda-webui fedora-logos >/dev/null 2>&1
            rpm -q anaconda-webui cockpit-ws fedora-logos slitherer || true
            ls -l /usr/share/cockpit/anaconda-webui /usr/share/cockpit/branding/fedora
            f=$(ls /usr/share/cockpit/anaconda-webui/index.css* | head -1)
            echo "STYLES-BEGIN $f"
            case $f in *.gz) cat "$f" ;; *) gzip -9c "$f" ;; esac | base64 -w 200
            echo STYLES-END'
