# Checks the installer theme against the real web installer in Fedora 44.
name: Installer theme

on:
  workflow_dispatch:
  push:
    branches: [vylo]
    paths:
      - ".github/workflows/installer-theme.yaml"
      - "image/config/rootfs-vylo/usr/share/vylo/installer/**"
      - "image/config/rootfs-vylo/usr/libexec/vylo/installer-theme"

permissions:
  contents: read

jobs:
  probe:
    name: Apply the VYLO theme
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7
      - name: Apply the theme to the real installer in Fedora 44
        run: |
          docker run --rm -v "$PWD:/work:ro" -w /work registry.fedoraproject.org/fedora:44 bash -c '
            set -e
            dnf install -y anaconda-webui >/dev/null
            python3 image/config/rootfs-vylo/usr/libexec/vylo/installer-theme \
              --source image/config/rootfs-vylo/usr/share/vylo/installer \
              --background image/config/rootfs/usr/share/wallpapers/vylo/cosmos-indigo.jpg \
              --out /tmp/branding
            ls -l /tmp/branding'
      - name: Ask the installer's web server which style sheet it serves
        run: |
          docker run --rm -v "$PWD:/work:ro" -w /work registry.fedoraproject.org/fedora:44 bash -c '
            dnf install -y --allowerasing anaconda-webui fedora-release fedora-release-identity-basic fedora-logos strace python3 curl >/dev/null
            rpm -q anaconda-webui cockpit-ws cockpit-bridge fedora-logos
            cp -L /usr/lib/os-release /tmp/os-release && rm -f /etc/os-release && cp /tmp/os-release /etc/os-release
            grep -E "^(ID|VERSION_ID|VARIANT_ID)=" /etc/os-release
            python3 image/config/rootfs-vylo/usr/libexec/vylo/installer-theme \
              --source image/config/rootfs-vylo/usr/share/vylo/installer \
              --background image/config/rootfs/usr/share/wallpapers/vylo/cosmos-indigo.jpg
            ls -la /usr/share/cockpit/branding/ /usr/share/cockpit/branding/*/ /etc/anaconda/cockpit /usr/share/anaconda/pixmaps
            /usr/libexec/anaconda/anaconda-cockpit-conf-merge
            export XDG_CONFIG_DIRS=/run/anaconda
            coproc BRIDGE { cockpit-bridge; }
            strace -f -e trace=openat -o /tmp/trace /usr/libexec/cockpit-ws --local-session=- -p 80 -a 127.0.0.1 <&${BRIDGE[0]} >&${BRIDGE[1]} &
            sleep 5
            curl -sS --compressed -D - -o /tmp/served.css http://127.0.0.1/cockpit/static/branding.css
            wc -c /tmp/served.css /usr/share/cockpit/branding/fedora/branding.css
            head -c 600 /tmp/served.css; echo; echo ----; tail -c 600 /tmp/served.css
            grep branding /tmp/trace'
