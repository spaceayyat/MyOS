name: Build VYLO ISO

on:
  workflow_dispatch:
  push:
    branches: ["**"]
    tags: ["v*"]

permissions:
  contents: read

jobs:
  lint:
    name: Lint and unit tests
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7
      - name: shellcheck every script
        run: tests/lint.sh
      - name: Unit tests
        run: |
          set -e
          for t in tests/unit/test_*.sh; do echo "== $t"; "$t"; done

  validate:
    name: Validate image description and package names
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7
      - name: kiwi-ng image info + dnf repoquery (Fedora 44)
        run: |
          docker run --rm -v "$PWD:/work:ro" -w /work \
            registry.fedoraproject.org/fedora:44 tests/validate-image.sh

  build:
    name: Build ISO (${{ matrix.edition }})
    needs: [lint, validate]
    strategy:
      fail-fast: false
      matrix:
        edition: [gnome, plasma, vylo]
    runs-on: ubuntu-24.04
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v7
      - name: Free disk space
        run: |
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc \
            /opt/hostedtoolcache/CodeQL
          df -h /
      - name: Build desktop and ISO in Fedora 44
        run: |
          sudo VYLO_REF="${GITHUB_REF}" VYLO_EDITION="${{ matrix.edition }}" \
            scripts/build-in-container.sh
      - name: Show checksums
        run: |
          cd output/iso
          ls -l
          sha256sum -c SHA256SUMS
      - uses: actions/upload-artifact@v7
        with:
          name: VYLO-ISO-${{ matrix.edition }}
          path: output/iso/
          if-no-files-found: error
          compression-level: 0
          retention-days: 14
      - name: Upload KIWI log
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: build-logs-${{ matrix.edition }}
          path: build/target/build/*.log
          if-no-files-found: ignore

  boot:
    name: Boot test (${{ matrix.edition }}, ${{ matrix.mode }})
    needs: build
    # Test whichever edition built, even if the other build failed.
    if: ${{ !cancelled() && needs.build.result != 'skipped' }}
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    strategy:
      fail-fast: false
      matrix:
        edition: [gnome, plasma, vylo]
        mode: [bios, uefi, secureboot]
    steps:
      - uses: actions/checkout@v7
      - name: Install QEMU and enable KVM
        run: |
          sudo apt-get update
          sudo apt-get install -y qemu-system-x86 ovmf
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' \
            | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
          ls -l /dev/kvm
      - uses: actions/download-artifact@v8
        with:
          name: VYLO-ISO-${{ matrix.edition }}
          path: iso
      - name: Verify checksum
        run: cd iso && sha256sum -c SHA256SUMS
      - name: Boot and check
        run: |
          python3 -I tests/vm/boot_test.py --mode "${{ matrix.mode }}" \
            --edition "${{ matrix.edition }}" \
            --iso "$(ls iso/*.iso)" --out vm-out
      - name: Upload screenshot and serial log
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: boot-${{ matrix.edition }}-${{ matrix.mode }}
          path: |
            vm-out/*.png
            vm-out/serial.log
          if-no-files-found: ignore

  install:
    name: Install test (${{ matrix.edition }}, ${{ matrix.disk }})
    needs: build
    # Test whichever edition built, even if the other build failed.
    if: ${{ !cancelled() && needs.build.result != 'skipped' }}
    runs-on: ubuntu-24.04
    timeout-minutes: 90
    strategy:
      fail-fast: false
      matrix:
        edition: [gnome, plasma, vylo]
        disk: [plain, luks]
    steps:
      - uses: actions/checkout@v7
      - name: Install QEMU and enable KVM
        run: |
          sudo apt-get update
          sudo apt-get install -y qemu-system-x86 qemu-utils ovmf
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' \
            | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
      - uses: actions/download-artifact@v8
        with:
          name: VYLO-ISO-${{ matrix.edition }}
          path: iso
      - name: Verify checksum
        run: cd iso && sha256sum -c SHA256SUMS
      - name: Install to a virtual disk, boot it, log in, update, reboot
        run: |
          python3 -I tests/vm/install_test.py --iso "$(ls iso/*.iso)" \
            --edition "${{ matrix.edition }}" --disk "${{ matrix.disk }}" \
            --out vm-out
      - name: Upload screenshots and serial logs
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: install-${{ matrix.edition }}-${{ matrix.disk }}
          path: |
            vm-out/*/*.png
            vm-out/*/serial.log
          if-no-files-found: ignore

  # While work is on the vylo branch, keep the VM screenshots where they can be
  # looked at, including those of a failed run.
  vm-screenshots:
    name: Save VM screenshots to the vylo branch
    if: ${{ !cancelled() && github.ref == 'refs/heads/vylo' }}
    needs: [boot, install]
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v7
        with:
          ref: vylo
      - uses: actions/download-artifact@v8
        with:
          pattern: boot-vylo-*
          path: shots
      - uses: actions/download-artifact@v8
        with:
          pattern: install-vylo-plain
          path: shots
      - name: Collect and commit
        run: |
          mkdir -p docs/screenshots/vm
          cd shots
          find . -name '*.png' | while read -r f; do
            cp "$f" "../docs/screenshots/vm/$(echo "${f#./}" | tr / -)"
          done
          cd ..
          git config user.name spaceayyat
          git config user.email azsr2710@gmail.com
          git add docs/screenshots/vm
          if git diff --cached --quiet; then exit 0; fi
          git commit -m "Update VM screenshots from the test run"
          git pull --rebase origin vylo
          git push origin HEAD:vylo

  # Marked as a pre-release: a complete graphical installation is not tested.
  release:
    name: Publish pre-release
    if: startsWith(github.ref, 'refs/tags/v')
    needs: [build, boot, install]
    runs-on: ubuntu-24.04
    permissions:
      contents: write
      id-token: write
      attestations: write
    steps:
      - uses: actions/checkout@v7
      - name: Check the tag matches the image version
        run: |
          version="$(sed -n 's|.*<version>\(.*\)</version>.*|\1|p' image/kiwi/config.xml)"
          [[ "${GITHUB_REF_NAME}" == "v${version}" || "${GITHUB_REF_NAME}" == "v${version}-"* ]]
      - uses: actions/download-artifact@v8
        with:
          name: VYLO-ISO-gnome
          path: iso-gnome
      - uses: actions/download-artifact@v8
        with:
          name: VYLO-ISO-plasma
          path: iso-plasma
      - uses: actions/download-artifact@v8
        with:
          name: VYLO-ISO-vylo
          path: iso-vylo
      - name: Verify and collect all editions
        run: |
          mkdir release
          for edition in gnome plasma vylo; do
            (cd "iso-${edition}" && sha256sum -c SHA256SUMS)
            mv "iso-${edition}"/*.iso "iso-${edition}"/*.packages release/
            mv "iso-${edition}/BUILD-INFO.txt" "release/BUILD-INFO-${edition}.txt"
          done
          (cd release && sha256sum -- * > ../SHA256SUMS && mv ../SHA256SUMS .)
          cat release/SHA256SUMS
      - name: Sign build provenance (keyless, Sigstore)
        uses: actions/attest-build-provenance@v4
        with:
          subject-path: |
            release/*.iso
            release/SHA256SUMS
      - name: Create the GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          cd release
          # A release asset must be smaller than 2 GiB: split larger ISOs.
          for f in *.iso; do
            if (( $(stat -c %s "$f") >= 2147483648 )); then
              split -b 1900M -d "$f" "$f.part"
              rm "$f"
            fi
          done
          # The release may already exist if the tag was made by publishing a
          # release on the GitHub website; then only add the files to it.
          title="VYLO ${GITHUB_REF_NAME#v}"
          if gh release view "${GITHUB_REF_NAME}" --repo "${GITHUB_REPOSITORY}" >/dev/null 2>&1; then
            gh release edit "${GITHUB_REF_NAME}" --repo "${GITHUB_REPOSITORY}" \
              --prerelease --title "${title}" --notes-file ../docs/release-notes.md
            gh release upload "${GITHUB_REF_NAME}" --repo "${GITHUB_REPOSITORY}" --clobber ./*
          else
            gh release create "${GITHUB_REF_NAME}" --repo "${GITHUB_REPOSITORY}" \
              --prerelease --verify-tag --title "${title}" \
              --notes-file ../docs/release-notes.md ./*
          fi

  # Real screenshots from the VMs that tested this tag, shown in the README.
  screenshots:
    name: Commit screenshots from this run
    if: startsWith(github.ref, 'refs/tags/v')
    needs: [release]
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    env:
      SCREENSHOT_BRANCH: main
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ env.SCREENSHOT_BRANCH }}
      - uses: actions/download-artifact@v8
        with:
          pattern: boot-*-uefi
          path: shots
      - uses: actions/download-artifact@v8
        with:
          pattern: install-*-plain
          path: shots
      - name: Install ImageMagick
        run: sudo apt-get update && sudo apt-get install -y imagemagick
      - name: Collect and commit
        run: |
          scripts/collect-screenshots.sh shots docs/screenshots
          git config user.name spaceayyat
          git config user.email azsr2710@gmail.com
          git add docs/screenshots
          if git diff --cached --quiet; then exit 0; fi
          git commit -m "Add screenshots from the ${GITHUB_REF_NAME} test run"
          git push origin "HEAD:${SCREENSHOT_BRANCH}"
