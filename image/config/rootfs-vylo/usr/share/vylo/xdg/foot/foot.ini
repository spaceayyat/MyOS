# VYLO's terminal look. Your own ~/.config/foot/foot.ini replaces it.
font=JetBrains Mono:size=11
pad=14x12

[cursor]
style=beam
blink=yes

[colors-dark]
alpha=0.96
background=0e0a20
foreground=f4f2ff
selection-background=3a2d73
selection-foreground=ffffff
urls=37d9ff
regular0=1b1440
regular1=ff5c7a
regular2=5ee6a8
regular3=ffc15e
regular4=7a78ff
regular5=c278ff
regular6=37d9ff
regular7=d9d4f5
bright0=5b5080
bright1=ff8aa0
bright2=90f2c6
bright3=ffd591
bright4=a9a7ff
bright5=d9aaff
bright6=8ae8ff
bright7=ffffff
